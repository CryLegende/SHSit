# SHSit - s'asseoir sur un coussin (remplace GSit)
#
# Le joueur s'assoit sur une entité coussin de Minecraft 26.3, posée par le plugin et retirée dès
# qu'il se relève. Le coussin ne peut ni être cassé, ni lâcher d'objet, ni être partagé.
# Clic droit à la main vide sur un bloc de la liste ci-dessous, ou /sit pour s'asseoir sur place.
# Se relever : accroupi (maj), ou /sit une seconde fois.
#
# Région WorldGuard : le flag « sit » (allow / deny) autorise ou interdit de s'asseoir dans la région.
# Sans flag, il faut pouvoir construire dans la région. Les îles SuperiorSkyblock2 sont réservées
# aux membres (et aux coop si island.coop est actif), voir island plus bas.

settings:
  # Mondes où l'on peut s'asseoir (liste vide = tous les mondes)
  worlds:
    - spawn
    - SuperiorWorld
    - Christmas
  # Couleur du coussin : WHITE, ORANGE, MAGENTA, LIGHT_BLUE, YELLOW, LIME, PINK, GRAY,
  # LIGHT_GRAY, CYAN, PURPLE, BLUE, BROWN, GREEN, RED, BLACK
  cushion-color: WHITE
  # Secondes minimum entre deux changements d'état (s'asseoir) d'un même joueur
  cooldown: 1.0
  # Les deux mains vides obligatoires pour s'asseoir d'un clic droit (sinon le clic pose le bloc tenu)
  empty-hand: true
  # Distance maximale entre les yeux du joueur et la place choisie (en blocs)
  max-distance: 4.5
  # Le joueur se relève quand il subit des dégâts
  stand-up-on-damage: true
  # Sur un escalier, le joueur est tourné vers le côté ouvert
  face-open-side: true
  # Écrit dans la console la raison de chaque refus (pour comprendre pourquoi un joueur ne s'assoit pas)
  debug: false

# Blocs sur lesquels un clic droit fait s'asseoir : un bloc (minecraft:moss_carpet) ou un tag (#minecraft:stairs).
# Seule la moitié basse des escaliers et des dalles est utilisable.
blocks:
  - '#minecraft:stairs'
  - '#minecraft:slabs'
  - '#minecraft:wool_carpets'
  - minecraft:moss_carpet
  - minecraft:pale_moss_carpet

# Îles SuperiorSkyblock2 : les membres de l'île peuvent toujours s'asseoir
island:
  # Les joueurs coop de l'île peuvent s'asseoir
  coop: true
  # Les visiteurs peuvent s'asseoir
  visitors: false

# Messages (codes & et couleurs hex &#RRGGBB)
messages:
  world: '&7&l« &c&lSH &8&l» &7On ne peut pas s''asseoir &cdans ce monde&7.'
  island: '&7&l« &c&lSH &8&l» &7Vous ne pouvez pas vous asseoir &csur cette île&7.'
  region: '&7&l« &c&lSH &8&l» &7Vous ne pouvez pas vous asseoir &cici&7.'
  occupied: '&7&l« &c&lSH &8&l» &7Cette place est &cdéjà occupée&7.'
  no-room: '&7&l« &c&lSH &8&l» &7Il n''y a &cpas assez de place &7pour s''asseoir ici.'
  not-on-ground: '&7&l« &c&lSH &8&l» &7Vous devez être &csur le sol &7pour vous asseoir.'
  no-permission: '&7&l« &c&lSH &8&l» &7Cette commande est réservée aux joueurs &fVIP&7.'
  reloaded: '&7&l« &a&lSH &8&l» &7Configuration &arechargée&7.'
  usage: '&7&l« &e&lSH &8&l» &7Utilisation : &e/shsit reload&7.'
