name: SHSit
version: '${project.version}'
main: org.Cry_Legende.sHSit.SHSit
api-version: '1.21'
author: Cry_Legende
description: S'asseoir, s'allonger, ramper, tournoyer et s'asseoir sur la tête des autres, en paquets (remplace GSit).
depend: [packetevents]
softdepend: [WorldGuard, SuperiorSkyblock2]

commands:
  sit:
    description: S'asseoir sur place, ou se relever. « /sit playertoggle » interdit ou autorise qu'on s'asseye sur vous.
    usage: /<command> [playertoggle]
  lay:
    description: S'allonger, ou se relever.
    usage: /<command>
  spin:
    description: Tournoyer sur place, ou s'arrêter.
    usage: /<command>
  bellyflop:
    description: S'allonger sur le ventre, ou se relever.
    usage: /<command>
  crawl:
    description: Ramper, ou se relever.
    usage: /<command>
  shsit:
    description: Administration de SHSit.
    usage: /<command> <reload|list|stand>

permissions:
  shsit.use:
    description: Utiliser les commandes de pose (/sit, /lay, /spin, /bellyflop, /crawl).
    default: op
    children:
      shsit.use.sit: true
      shsit.use.lay: true
      shsit.use.spin: true
      shsit.use.bellyflop: true
      shsit.use.crawl: true
  shsit.use.sit:
    description: Utiliser /sit.
    default: op
  shsit.use.lay:
    description: Utiliser /lay.
    default: op
  shsit.use.spin:
    description: Utiliser /spin.
    default: op
  shsit.use.bellyflop:
    description: Utiliser /bellyflop.
    default: op
  shsit.use.crawl:
    description: Utiliser /crawl.
    default: op
  shsit.sit:
    description: S'asseoir d'un clic droit sur un escalier, une dalle ou un tapis.
    default: true
  shsit.playersit:
    description: S'asseoir d'un clic droit sur la tête d'un joueur.
    default: true
  shsit.bypass:
    description: Se poser malgré les protections d'île et de région.
    default: op
  shsit.admin:
    description: Toutes les sous-commandes de /shsit.
    default: op
    children:
      shsit.admin.reload: true
      shsit.admin.list: true
      shsit.admin.stand: true
  shsit.admin.reload:
    description: /shsit reload, recharge config.yml et messages.yml.
    default: op
  shsit.admin.list:
    description: /shsit list, liste des joueurs posés.
    default: op
  shsit.admin.stand:
    description: /shsit stand, relève un joueur posé.
    default: op
